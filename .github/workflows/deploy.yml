name: Despliegue y CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configurar Python
        run: uv python install ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: uv sync

      - name: Ejecutar pruebas
        run: uv run pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Desplegar (placeholder)
        run: |
          echo "Despliegue listo. Configura tu plataforma (Railway, Render, Fly.io, etc.)"
          echo "Conecta este repositorio y establece las variables de entorno en .env"